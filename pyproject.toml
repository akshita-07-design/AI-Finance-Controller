[project]
name = "recon"
version = "0.1.0"
description = "Three-way settlement reconciliation agent — Razorpay AI Buildathon, Track 04"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "faker>=24.0",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
